name: Build & Release

# Сборка запускается при пуше тега вида v1.2.3, а также вручную из вкладки Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Версия/тег для ручного релиза (например, v2.0.0)'
        required: true

permissions:
  contents: write   # нужно для создания релиза и загрузки артефактов

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Определить версию из тега
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"   # v1.2.3 -> 1.2.3

      - name: Publish обоих приложений (console + desktop, win-x64/x86, fdd + self-contained)
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          mkdir -p dist

          publish() {
            local proj="$1" label="$2" rid="$3" mode="$4"
            local out="publish/$label-$rid-$mode"
            local args=(-c Release -r "$rid" \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:Version="$VERSION" -o "$out")
            if [ "$mode" = "sc" ]; then
              args+=(--self-contained -p:EnableCompressionInSingleFile=true)
            else
              args+=(--no-self-contained)
            fi
            dotnet publish "$proj" "${args[@]}"
            local suffix=""
            [ "$mode" = "sc" ] && suffix="-self-contained"
            cp "$out/MooRCON.exe" "dist/MooRCON-$TAG-$label-$rid$suffix.exe"
          }

          for rid in win-x64 win-x86; do
            for mode in fdd sc; do
              publish "MooRCON.csproj"                  "console" "$rid" "$mode"
              publish "MooRCON.Wpf/MooRCON.Wpf.csproj"  "desktop" "$rid" "$mode"
            done
          done
          ls -la dist

      - name: Создать релиз и загрузить сборки
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            dist/*.exe \
            --title "MooRCON ${{ steps.ver.outputs.tag }}" \
            --generate-notes
