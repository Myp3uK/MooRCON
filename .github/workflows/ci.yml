name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Отменяем предыдущий незавершённый прогон на той же ветке/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # windows-latest обязателен: MooRCON.Wpf (net10.0-windows + WPF) не собирается на Linux.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MooRCON.sln

      - name: Build
        run: dotnet build MooRCON.sln -c Release --no-restore
